# Security updates only. `open-pull-requests-limit: 0` turns off routine
# version bumps; Dependabot security updates (enabled in repo settings) ignore
# this limit and still open PRs for advisories.
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels:
      - 'area:dx'
    groups:
      # Batch advisories found in the same run into one PR instead of one per package.
      security:
        applies-to: security-updates
        patterns:
          - '*'

  # Action SHA pins in .github/workflows only move on a security advisory.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels:
      - 'area:dx'
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
